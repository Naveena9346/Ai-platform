name: NexusAI & DataQuest Platform CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install pytest pytest-asyncio pytest-cov httpx aiosqlite

      - name: Run Nexus AI PyTest Suite
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test_nexus.db
          SECRET_KEY: test_secret_key_ci
          PYTHONPATH: .
        run: |
          pytest nexus_tests/ -v

  frontend-quality-and-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install & Build Nexus Frontend
        run: |
          if [ -d nexus_frontend ]; then
            cd nexus_frontend
            npm install
            npm run build || true
          elif [ -d frontend ]; then
            cd frontend
            npm install || true
          fi

